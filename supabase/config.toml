# Vishvakarma.OS — Supabase Auth + Postgres (production backend)

project_id = "jyocvwipthswfcmvqgqe"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://vishvakarma-os.app"
additional_redirect_urls = [
  "https://vishvakarma-os.app/auth",
  "https://vishvakarma-os.app/reset-password",
  "https://vishvakarma-os.app/editor",
  "https://vishvakarma-os.app/**",
  "https://vishvakarma-os.pages.dev/auth",
  "https://vishvakarma-os.pages.dev/reset-password",
  "https://vishvakarma-os.pages.dev/**",
  "https://*.vishvakarma-os.pages.dev/auth",
  "https://*.vishvakarma-os.pages.dev/reset-password",
  "https://*.vishvakarma-os.pages.dev/**",
  "https://vishvakarma-os.vercel.app/auth",
  "https://vishvakarma-os.vercel.app/reset-password",
  "https://vishvakarma-os.vercel.app/**",
  "https://*.vercel.app/auth",
  "http://127.0.0.1:5173/auth",
  "http://127.0.0.1:5173/reset-password",
  "http://127.0.0.1:5173/**",
]
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Email/password is the only public account method. New accounts require email
# confirmation, and recovery links return to the public reset-password route.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Phone MFA remains disabled until an approved SMS provider and recovery policy exist.
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Retired social login remains disabled. Vishvakarma.OS exposes Supabase email/password only.
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
skip_nonce_check = false
