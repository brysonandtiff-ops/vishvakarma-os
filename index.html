<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#17120c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vishvakarma.OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Vishvakarma.OS" />
    <meta
      name="description"
      content="Draw floor plans, inspect Sacred 3D View, and export client-ready packages. A governed architecture workstation in your browser."
    />
    <title>Vishvakarma.OS — iPad-First Architecture Studio</title>

    <!-- Social share cards (crawlers do not execute JS — keep these static) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vishvakarma.OS" />
    <meta property="og:title" content="Vishvakarma.OS — iPad-First Architecture Studio" />
    <meta
      property="og:description"
      content="Draw floor plans, inspect Sacred 3D View, and export client-ready packages. A governed architecture workstation in your browser."
    />
    <meta property="og:url" content="https://vishvakarma-os.app/" />
    <meta property="og:image" content="https://vishvakarma-os.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vishvakarma.OS — draw floor plans, review in 3D, export proof" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vishvakarma.OS — iPad-First Architecture Studio" />
    <meta
      name="twitter:description"
      content="Draw floor plans, inspect Sacred 3D View, and export client-ready packages. A governed architecture workstation in your browser."
    />
    <meta name="twitter:image" content="https://vishvakarma-os.app/og-card.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/vishvakarma-apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px)" href="/splash/apple-splash-1125-2436.png" />
    <!-- Fonts are self-hosted via @fontsource packages in src/main.tsx. -->
  
</head>
  <body>
    <div id="boot-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#17120c;color:#f6e7c1;transition:opacity .2s ease;pointer-events:none">
      <span style="font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase">Vishvakarma.OS</span>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('boot-splash');
        if (splash) {
          splash.style.opacity = '0';
          window.setTimeout(() => splash.remove(), 220);
        }
      }, { once: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
