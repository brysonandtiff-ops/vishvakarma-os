name: SIRE Independent Static Quality & Unit Evidence

on:
  push:
    branches:
      - sire/vish-static-quality-proof-20261026
    paths:
      - .github/workflows/sire-static-quality-proof.yml

permissions:
  contents: read

jobs:
  unit:
    name: Complete Vitest unit regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify pristine PR175 source tree without this temporary runner file
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/sire-static-quality-proof.yml
          actual_tree="$(git write-tree)"
          expected_tree='c9bd426866ad9197b5ecb6a14f34357bf2f01b61'
          test "$actual_tree" = "$expected_tree"
          echo "Verified exact PR175 source tree: $actual_tree"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute complete unit suite
        run: pnpm run test

  types:
    name: TypeScript application and API static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify pristine PR175 source tree without this temporary runner file
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/sire-static-quality-proof.yml
          actual_tree="$(git write-tree)"
          expected_tree='c9bd426866ad9197b5ecb6a14f34357bf2f01b61'
          test "$actual_tree" = "$expected_tree"
          echo "Verified exact PR175 source tree: $actual_tree"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify project and API types
        run: pnpm run lint:types

  security:
    name: Static security and system-contract gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify pristine PR175 source tree without this temporary runner file
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/sire-static-quality-proof.yml
          actual_tree="$(git write-tree)"
          expected_tree='c9bd426866ad9197b5ecb6a14f34357bf2f01b61'
          test "$actual_tree" = "$expected_tree"
          echo "Verified exact PR175 source tree: $actual_tree"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run production hardening and API security guards
        run: pnpm run hardening:gates
      - name: Run system contract, PWA and device hardening checks
        run: pnpm run contract:gates
      - name: Run auth configuration guards
        run: pnpm run auth:gates
