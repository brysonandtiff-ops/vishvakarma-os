name: SIRE Read-only Full Git History Secret Audit

on:
  push:
    branches:
      - sire/vish-history-secret-audit-20261027
    paths:
      - .github/workflows/sire-history-secret-audit.yml

permissions:
  contents: read

jobs:
  history-scan:
    name: Scan all reachable branch and tag history without disclosing findings
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout full reachable repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and include all upstream branch and tag references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-history-secret-audit.yml
          test "$(git write-tree)" = "c6b8309aebc168bf3d851a9aa7e296b1b21a847d"
          git fetch --quiet --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          echo "Read-only scan scope: $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | wc -l | tr -d ' ') branch/tag refs"
          echo "Reachable commit count: $(git rev-list --all --count)"
      - name: Install checksum-verified Gitleaks 8.30.1 from upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sire-audit-tool"
          cd "$RUNNER_TEMP/sire-audit-tool"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep -F 'gitleaks_8.30.1_linux_x64.tar.gz' checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' > verify.sha256
          test "$(wc -l < verify.sha256 | tr -d ' ')" = 1
          sha256sum -c verify.sha256
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Scan ALL fetched reachable commit history with no raw logs or uploads
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sire-gitleaks-default.toml" <<'CFG'
          [extend]
          useDefault = true
          CFG
          : > "$RUNNER_TEMP/sire-gitleaks-empty-ignore"
          set +e
          "$RUNNER_TEMP/sire-audit-tool/gitleaks" git . --no-banner --no-color --log-level error --redact=100 --config "$RUNNER_TEMP/sire-gitleaks-default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/sire-gitleaks-empty-ignore" --ignore-gitleaks-allow --log-opts='--all' --report-format=json --report-path="$RUNNER_TEMP/sire-history-raw.json" --exit-code=77 >/dev/null 2>/dev/null
          scan_result=$?
          set -e
          if [ "$scan_result" != 0 ] && [ "$scan_result" != 77 ]; then
            echo "::error::Gitleaks scan did not finish normally; exit=$scan_result (no secrets exposed)"
            exit 2
          fi
          echo "SIRE_GITLEAKS_SCAN_STATUS=$scan_result" >> "$GITHUB_ENV"
      - name: Publish only non-sensitive aggregate counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          from collections import Counter
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sire-history-raw.json'
          if not p.exists():
              raise SystemExit('Missing raw scanner report: scan cannot be certified')
          findings=json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(findings, list):
              raise SystemExit('Malformed scanner report: scan cannot be certified')
          rules=Counter(str(item.get('RuleID','unknown'))[:90] for item in findings)
          def group(item):
              name=str(item.get('File','')).replace('\\','/').lower()
              if name.startswith('.local/') or '/.local/' in name: return 'historic_local_state'
              if any(z in name for z in ('.wrangler/', '.vercel/', 'storage-state', '.clixml')): return 'historic_tool_state'
              if '/dist/' in name or name.startswith('dist/'): return 'generated_output'
              return 'other_history'
          data={
            'result':'FINDINGS' if findings else 'NO_FINDINGS',
            'scope':'all refs/remotes/origin/* and refs/tags/* fetched; locally reachable commits',
            'source_tree':'c6b8309aebc168bf3d851a9aa7e296b1b21a847d',
            'tool':'gitleaks 8.30.1 checksum verified; default rules; ignore comments disabled',
            'finding_count':len(findings),
            'unique_commit_count':len({str(item.get('Commit','')) for item in findings}),
            'rule_counts':dict(sorted(rules.items())),
            'coarse_path_counts':dict(sorted(Counter(group(x) for x in findings).items())),
            'limits':'Only reachable fetched Git refs; not forks, deleted/unreachable history, GitHub caches, CI artifacts or credential validity',
            'secrets_included':False,
          }
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'sire-history-summary.json'
          out.write_text(json.dumps(data,indent=2)+'\n', encoding='utf-8')
          print('S.I.R.E. redacted history audit counts only:')
          print(json.dumps(data,indent=2))
          PY
      - name: Upload sanitized counters only, never raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-aggregate-${{ github.run_id }}
          path: sire-history-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed when any historical secret finding exists
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SIRE_GITLEAKS_SCAN_STATUS" != 0 ]; then
            echo '::error::Historical secret exposures detected. Issue #153 remains open; no release allowed.'
            exit 1
          fi
          echo 'No findings in the scanned reachable Git refs; further external footprint checks are still required.'
