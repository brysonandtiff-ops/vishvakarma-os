name: SIRE Synthetic Only Git History Path Purge Proof

on:
  push:
    branches:
      - sire/vish-history-path-purge-rehearsal-20261027
    paths:
      - .github/workflows/sire-synthetic-purge-proof.yml

permissions:
  contents: read

jobs:
  synthetic-filter:
    name: Test git-filter-repo only on fictional ephemeral Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIRE_SYNTHETIC_HISTORY_REHEARSAL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact tested source tree, excluding temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-synthetic-purge-proof.yml
          test "$(git write-tree)" = "61b513761e7063e62dcd97d4b7c45617a4e0d556"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Parse-only verification
        run: node --check scripts/security/history-path-purge-rehearsal.mjs
      - name: Positive/negative forbidden history path selectors
        run: pnpm exec vitest run scripts/security/history-path-purge-rehearsal.test.mjs
      - name: Install isolated pinned git-filter-repo CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sire-filter-tool"
          "$RUNNER_TEMP/sire-filter-tool/bin/pip" --disable-pip-version-check install --quiet 'git-filter-repo==2.47.0'
      - name: Run actual filter-repo only inside synthetic tmpdir
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security/history-path-purge-rehearsal.mjs --synthetic-only "$RUNNER_TEMP/sire-filter-tool/bin/git-filter-repo"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "61b513761e7063e62dcd97d4b7c45617a4e0d556"

  project-regression:
    name: Full Vitest TypeScript and production security unaffected
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact tested source tree, excluding temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-synthetic-purge-proof.yml
          test "$(git write-tree)" = "61b513761e7063e62dcd97d4b7c45617a4e0d556"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Entire unit suite
        run: pnpm run test
      - name: Types and mandatory security gates
        run: pnpm run lint:types && pnpm run hardening:gates && pnpm run auth:gates && pnpm run contract:gates
