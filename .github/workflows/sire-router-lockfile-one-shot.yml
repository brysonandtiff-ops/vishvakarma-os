name: SIRE Router Lockfile Regeneration (temporary, branch scoped)

on:
  push:
    branches:
      - sire/router-lockfile-20261026
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/sire/router-lockfile-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify no direct vulnerable package
        run: |
          test "${GITHUB_REF}" = 'refs/heads/sire/router-lockfile-20261026'
          node -e "if (Object.hasOwn(require('./package.json').dependencies, 'react-router')) process.exit(1)"
      - name: Regenerate lockfile exclusively with pinned pnpm
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify no vulnerable router or lockfile mismatch
        run: |
          if grep -Fq 'react-router@7.17.0' pnpm-lock.yaml; then
            echo '::error::Outdated React Router still resolved in lockfile'
            exit 1
          fi
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused unit regression
        run: pnpm exec vitest run src/test/functionalWiring.test.ts src/test/projectsDemoSamples.test.ts
      - name: Commit pnpm-generated lockfile on repair branch only
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/sire/router-lockfile-20261026'
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo '::error::Expected a regenerated lockfile change'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): regenerate pnpm lockfile without stale direct react-router'
          git push origin HEAD:refs/heads/sire/router-lockfile-20261026
