name: SIRE Encrypted Backup Owner-Safety Final Synthetic Proof

on:
  push:
    branches:
      - sire/vish-encrypted-backup-command-20261027
    paths:
      - .github/workflows/sire-encrypted-backup-final-proof.yml

permissions:
  contents: read

jobs:
  owner-encryption:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact reviewed source Git tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-encrypted-backup-final-proof.yml
          test "$(git write-tree)" = "293a90007376387d407fc6a89ba1116287c54b57"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install age CLI for purely synthetic backup tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
      - name: Run all unit tests including five encrypted-backup safety assertions
        run: pnpm run test
      - name: Static policy and type gates
        run: pnpm run lint:types && pnpm run hardening:gates && pnpm run contract:gates && pnpm run auth:gates
