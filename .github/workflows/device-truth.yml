name: Multi-Device Human Truth

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Optional Playwright project name, for example ipad-11-webkit
        required: false
        default: ''
      final_report:
        description: Generate final report filename instead of baseline
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  emulated-device-truth:
    name: Emulated device/browser truth matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run multi-device truth validation
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.final_report }}" == "true" ]]; then
            args+=("--final")
          fi
          if [[ -n "${{ inputs.profile }}" ]]; then
            args+=("--project=${{ inputs.profile }}")
          fi
          node scripts/device-truth/run.mjs "${args[@]}"

      - name: Upload truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vishvakarma-device-truth-${{ github.sha }}
          path: evidence/device-tests/
          if-no-files-found: warn
          retention-days: 14

      - name: State evidence boundary
        if: always()
        run: |
          echo "This workflow produces EMULATED DEVICE / BROWSER ENGINE evidence."
          echo "It is not physical iPhone, iPad, Android, Surface, or macOS hardware proof."
