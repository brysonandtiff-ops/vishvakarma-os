name: PHIRO Termux ARM64 Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.actor == 'brysonandtiff-ops'
    runs-on: [self-hosted, Linux, ARM64, phiro-termux]
    timeout-minutes: 10
    steps:
      - name: Prove Termux runner
        shell: bash
        run: |
          set -euo pipefail
          echo "PHIRO_TERMUX_RUNNER_OK=true"
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          uname -a
          node --version || true
          git --version
