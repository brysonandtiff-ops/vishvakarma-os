name: SIRE Current Source Key Classification (Redacted)

on:
  push:
    branches:
      - sire/vish-current-source-key-triage-20261027
    paths:
      - .github/workflows/sire-current-key-triage.yml

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate application tree without test workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-current-key-triage.yml
          test "$(git write-tree)" = "9e97a3782fb81b0e081cf2ff690e367b34bb594a"
          git fetch --quiet origin main:refs/remotes/origin/main
          mkdir -p "$RUNNER_TEMP/main-current" "$RUNNER_TEMP/candidate-current"
          git archive refs/remotes/origin/main | tar -x -C "$RUNNER_TEMP/main-current"
          git archive "9e97a3782fb81b0e081cf2ff690e367b34bb594a" | tar -x -C "$RUNNER_TEMP/candidate-current"
      - name: Install upstream checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner"
          cd "$RUNNER_TEMP/scanner"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep -F 'gitleaks_8.30.1_linux_x64.tar.gz' checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' > verify.sha256
          test "$(wc -l < verify.sha256 | tr -d ' ')" = 1
          sha256sum -c verify.sha256
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan current source snapshots without printing matches
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/empty-gitleaks-ignore"
          for name in main candidate; do
            if [ "$name" = main ]; then target="$RUNNER_TEMP/main-current"; else target="$RUNNER_TEMP/candidate-current"; fi
            set +e
            "$RUNNER_TEMP/scanner/gitleaks" dir "$target" --no-banner --no-color --log-level error --redact=100 --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaks-ignore" --report-format=json --report-path="$RUNNER_TEMP/$name-findings.json" --exit-code=77 >/dev/null 2>/dev/null
            result=$?
            set -e
            if [ "$result" != 0 ] && [ "$result" != 77 ]; then
              echo '::error::Source scan failed unexpectedly; release remains blocked'
              exit 2
            fi
            echo "SIRE_SCAN_${name^^}=$result" >> "$GITHUB_ENV"
          done
      - name: Derive coarse classification without leaking locations or values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, collections, json, os, pathlib, re
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          def load(name):
              f=tmp/f'{name}-findings.json'
              result=json.loads(f.read_text(encoding='utf-8')) if f.exists() else []
              if not isinstance(result,list): raise SystemExit('Malformed scanner result, fail closed')
              if not f.exists() and os.environ.get(f'SIRE_SCAN_{name.upper()}')!='0': raise SystemExit('Expected report missing')
              return result
          sources={k:load(k) for k in ('main','candidate')}
          def group(entry):
              p=str(entry.get('File','')).replace('\\','/').lower()
              s=p.split('/')
              leaf=s[-1] if s else ''
              if 'test' in s or 'tests' in s or 'fixtures' in s or 'e2e' in s or '.test.' in leaf or '.spec.' in leaf:
                  return 'tests_or_fixtures'
              if 'src' in s:return 'application_source'
              if 'scripts' in s:return 'maintenance_scripts'
              if 'docs' in s or leaf.endswith(('.md','.mdx')):return 'documentation'
              if 'public' in s:return 'public_assets'
              return 'other_tracked_source'
          def claim(entry):
              secret=str(entry.get('Secret',''))
              match=str(entry.get('Match',''))
              low=(secret+' '+match).lower()
              if secret.startswith('sb_publishable_'):return 'public_supabase_publishable_format'
              if secret.startswith('sb_anon_'):return 'public_supabase_anon_format'
              if secret.startswith('sk_live_') or secret.startswith('rk_live_'):return 'possible_stripe_live_format'
              if secret.startswith('sk_test_') or secret.startswith('rk_test_'):return 'possible_stripe_test_format'
              if secret.startswith('AIza'):return 'possible_google_api_key_format'
              if secret.count('.')==2 and secret.startswith('eyJ'):
                  try:
                      raw=secret.split('.')[1]
                      payload=json.loads(base64.urlsafe_b64decode(raw+'='*((-len(raw))%4)))
                      if payload.get('role')=='anon':return 'jwt_claims_supabase_anon'
                      if payload.get('role')=='service_role':return 'jwt_claims_elevated_service_role'
                  except Exception:pass
                  return 'jwt_claims_unclassified'
              if any(x in low for x in ('dummy','fake','placeholder','example','your_key_here')):
                  return 'has_synthetic_marker_unverified'
              return 'generic_unverified'
          def metadata(arr):
              return {
                'match_count':len(arr),
                'rules':dict(sorted(collections.Counter(str(x.get('RuleID','unknown'))[:80] for x in arr).items())),
                'location_classes':dict(sorted(collections.Counter(group(x) for x in arr).items())),
                'credential_format_hints':dict(sorted(collections.Counter(claim(x) for x in arr).items())),
              }
          # The identifiers are compared in memory and never printed or uploaded.
          def internal_identity(arr):
              return collections.Counter((str(x.get('Secret','')),str(x.get('RuleID',''))) for x in arr)
          m=internal_identity(sources['main'])
          c=internal_identity(sources['candidate'])
          changes=c-m
          removed=m-c
          report={
            'main':metadata(sources['main']),
            'candidate':metadata(sources['candidate']),
            'candidate_new_matches_vs_main':sum(changes.values()),
            'candidate_missing_matches_vs_main':sum(removed.values()),
            'source_tree':'9e97a3782fb81b0e081cf2ff690e367b34bb594a',
            'secrets_or_file_paths_included':False,
            'limitations':'Scanner patterns, not confirmation of live credential or false positive; does not examine external forks, caches or historic secret validity',
            'release_state':'BLOCKED_PENDING_PRIVATE_TRIAGE',
          }
          print('REDACTED_CLASSIFICATION_BEGIN')
          print(json.dumps(report,indent=2))
          print('REDACTED_CLASSIFICATION_END')
          (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'sire-source-key-summary.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Archive only redacted classification counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-key-triage-sanitized-${{ github.run_id }}
          path: sire-source-key-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail closed while current source detections remain untriaged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('sire-source-key-summary.json',encoding='utf-8') as stream:
              report=json.load(stream)
          if report['main']['match_count'] or report['candidate']['match_count']:
              raise SystemExit('Current source key candidates require private provider/owner triage; no release promotion')
          PY
