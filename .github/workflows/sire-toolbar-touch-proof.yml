name: SIRE Editor Touch Target Evidence

on:
  push:
    branches:
      - sire/vish-toolbar-touch-targets-20261027
    paths:
      - .github/workflows/sire-toolbar-touch-proof.yml

permissions:
  contents: read

jobs:
  ipad-phone-controls:
    name: Real Chromium iPad + phone touch-target checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install real Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build isolated editor preview
        run: node scripts/build-e2e-local.mjs
      - name: Prove real measured hit target sizes and no overflow
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-toolbar-test.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/editor > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vish-toolbar-test.log
            exit 1
          fi
          pnpm exec playwright test e2e/ipad-editor-layout.spec.ts --project=app-smoke-chromium --grep 'editor workspace fits iPad|editor portrait with 3D panel open|editor survives iPad rotation'
          pnpm exec playwright test e2e/device-phone-editor.spec.ts --project=app-smoke-chromium --grep 'editor zoom controls meet 44px'
      - name: Archive real viewport test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-touch-proof-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
