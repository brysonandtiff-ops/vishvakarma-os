name: SIRE Full Customer Auth Contract & Touch Test Evidence

on:
  push:
    branches:
      - sire/vish-full-customer-auth-contract-20261027
    paths:
      - .github/workflows/sire-full-customer-auth-proof.yml

permissions:
  contents: read

jobs:
  full-customer-auth:
    name: Approved account auth and unchanged device touch checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Git checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build isolated local test mode
        run: node scripts/build-e2e-local.mjs
      - name: Start real preview and exercise five auth device sizes
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-full-customer-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/auth > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo '::error::Local auth preview HTTP readiness failed'
            cat /tmp/vish-full-customer-preview.log
            exit 1
          fi
          pnpm exec playwright test e2e/full-customer-audit.spec.ts --project=app-smoke-chromium --grep 'approved-account auth and layout are safe'
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-customer-auth-proof-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
