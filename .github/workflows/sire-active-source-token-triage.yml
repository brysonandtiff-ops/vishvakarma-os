name: SIRE Read-only Present-Source Token Provenance Triage

on:
  push:
    branches:
      - sire/vish-active-key-safe-triage-20261027
    paths:
      - .github/workflows/sire-active-source-token-triage.yml

permissions:
  contents: read

jobs:
  safe-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read full repository without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and original main comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-active-source-token-triage.yml
          test "$(git write-tree)" = "9e97a3782fb81b0e081cf2ff690e367b34bb594a"
          git fetch --quiet --force origin '+refs/heads/main:refs/remotes/origin/main'
          mkdir -p "$RUNNER_TEMP/scan-main" "$RUNNER_TEMP/scan-candidate"
          git archive refs/remotes/origin/main | tar -x -C "$RUNNER_TEMP/scan-main"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan-candidate"
          rm -f "$RUNNER_TEMP/scan-candidate/.github/workflows/sire-active-source-token-triage.yml"
      - name: Install checksum verified Gitleaks scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan-bin"
          cd "$RUNNER_TEMP/scan-bin"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o tool.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep -F 'gitleaks_8.30.1_linux_x64.tar.gz' checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/tool.tar.gz/' > verify.sha256
          test "$(wc -l < verify.sha256 | tr -d ' ')" = 1
          sha256sum -c verify.sha256
          tar -xzf tool.tar.gz gitleaks
          chmod +x gitleaks
      - name: Analyze scanner output privately and emit safe metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from datetime import datetime, timezone
          import json, os, re, subprocess
          root=Path(os.environ['RUNNER_TEMP'])
          workspace=Path(os.environ['GITHUB_WORKSPACE'])
          scanner=root/'scan-bin/gitleaks'
          def scan(directory, label):
              outfile=root/(label+'-private.json')
              result=subprocess.run([str(scanner),'dir','.',
                   '--no-banner','--no-color','--log-level','error','--redact=100',
                   '--ignore-gitleaks-allow','--report-format=json',
                   '--report-path',str(outfile),'--exit-code=77'],
                   cwd=directory,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
              if result.returncode not in (0,77):
                  raise SystemExit('Scanner failed without valid completion; no clean conclusion')
              if result.returncode==77 and not outfile.exists():
                  raise SystemExit('Scanner found secrets without producing private local report')
              data=json.loads(outfile.read_text('utf-8')) if outfile.exists() else []
              if not isinstance(data,list): raise SystemExit('Malformed private scan report')
              return data
          previous=scan(root/'scan-main','main')
          candidate=scan(root/'scan-candidate','candidate')
          def relpath(item,base):
              raw=str(item.get('File','')).replace('\\','/')
              prefix=str(base).replace('\\','/')+'/'
              return raw[len(prefix):] if raw.startswith(prefix) else raw.removeprefix('./')
          def identity(item,base):
              # Entire secret is compared only in this ephemeral runner's memory.
              return (str(item.get('RuleID','')),relpath(item,base),str(item.get('Secret','')))
          old_ids=Counter(identity(x,root/'scan-main') for x in previous)
          new_ids=Counter(identity(x,root/'scan-candidate') for x in candidate)
          introduced=sum((new_ids-old_ids).values())
          resolved=sum((old_ids-new_ids).values())
          def group(path):
              pieces=path.lower().replace('\\','/').split('/')
              base=pieces[-1]
              if any(x in pieces for x in ('test','tests','__tests__','fixtures','e2e')) or base.endswith(('.test.ts','.test.tsx','.spec.ts','.test.mjs','.spec.mjs')):
                  return 'test_or_fixture'
              if base.endswith(('.md','.mdx')) or 'docs' in pieces: return 'documentation'
              if 'src' in pieces: return 'application_source'
              if 'scripts' in pieces: return 'maintenance_script'
              if 'public' in pieces: return 'public_asset'
              return 'other_tracked_source'
          hints=re.compile(r'\b(mock|example|placeholder|fixture|fake|dummy|test-only|fake-key|redacted)\b',re.I)
          def describe(item,base):
              path=relpath(item,base)
              n=int(item.get('StartLine') or 0)
              source=base/path
              lines=source.read_text('utf-8',errors='replace').splitlines() if source.exists() else []
              context=' '.join(lines[max(0,n-3):min(len(lines),n+2)])
              value=str(item.get('Secret',''))
              sanitized=context.replace(value,'[REDACTED]') if value else context
              return {
                'rule':str(item.get('RuleID','unknown'))[:80],
                'coarse_category':group(path),
                'source_extension':Path(path).suffix.lower()[:12] or '(none)',
                'placeholder_marker_nearby':bool(hints.search(sanitized)),
                'possible_mock_marker_in_value':bool(hints.search(value)),
                'verification':'UNKNOWN — pattern detection only; provider-side validity not tested',
              }
          report={
            'result':'OPEN_TRIAGE' if candidate else 'NO_PRESENT_SOURCE_FINDINGS',
            'main_exact_gitleaks_matches':len(previous),
            'candidate_exact_gitleaks_matches':len(candidate),
            'new_candidate_findings_vs_main':introduced,
            'disappeared_main_findings_in_candidate':resolved,
            'main_rule_counts':dict(Counter(str(x.get('RuleID','unknown')) for x in previous)),
            'candidate_safe_details':[describe(x,root/'scan-candidate') for x in candidate],
            'limits':'Gitleaks pattern matches do not establish key validity. No credential values, hashes, source snippets, paths or exact line numbers exposed.',
            'keys_tested_with_provider':False,
            'release_authorized':False,
          }
          (workspace/'sire-current-token-triage.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print('Safe metadata only:')
          print(json.dumps(report,indent=2))
          PY
      - name: Archive sanitized report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-token-triage-${{ github.run_id }}
          path: sire-current-token-triage.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail closed on any untriaged present-source matches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('sire-current-token-triage.json',encoding='utf-8') as f:
              result=json.load(f)
          if result['new_candidate_findings_vs_main']:
              raise SystemExit('New current-source token pattern detected: release blocked')
          if result['candidate_exact_gitleaks_matches']:
              raise SystemExit('Existing untriaged token patterns remain: release blocked')
          PY