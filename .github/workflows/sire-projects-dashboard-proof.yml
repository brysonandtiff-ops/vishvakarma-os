name: SIRE Projects Dashboard Reopen Evidence

on:
  push:
    branches:
      - sire/vish-projects-dashboard-contract-20261027
    paths:
      - .github/workflows/sire-projects-dashboard-proof.yml

permissions:
  contents: read

jobs:
  projects-navigation:
    name: Projects local-storage navigation and saved project reopen
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium browser and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build isolated local-only app
        run: node scripts/build-e2e-local.mjs
      - name: Real /projects dashboard and persisted saved-card acceptance
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-projects.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/projects > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vish-projects.log
            exit 1
          fi
          pnpm exec playwright test e2e/projects-profile.spec.ts --project=app-smoke-chromium
      - name: Archive real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projects-dashboard-proof-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
