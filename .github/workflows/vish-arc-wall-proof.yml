name: VISH Arc Wall Real Video Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/utils/arcWallGeometry.ts'
      - 'src/components/editor/**'
      - 'src/pages/EditorPage.tsx'
      - 'e2e/arc-wall-proof.spec.ts'
      - '.github/workflows/vish-arc-wall-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-arc-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: VISH real editor video test
        run: pnpm exec playwright test e2e/arc-wall-proof.spec.ts --project=app-smoke-chromium --retries=0
      - name: Geometry and undo regression tests
        if: success()
        run: pnpm exec vitest run src/utils/arcWallGeometry.test.ts src/core/floorPlanEngine.test.ts
      - name: Preserve original browser recording and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vish-arc-wall-real-video
          path: |
            test-results/
            playwright-report/
            evidence/
          retention-days: 14
          if-no-files-found: warn
