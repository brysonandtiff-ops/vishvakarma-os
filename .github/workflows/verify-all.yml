name: Verify All

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    name: Offline Production Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type checks
        run: pnpm run lint:types

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: Contract gates
        run: pnpm run contract:gates

      - name: Hardening gates
        run: pnpm run hardening:gates

      - name: API security gate
        run: pnpm run security:api

      - name: PWA and bundle performance gates
        run: pnpm run perf:gates

      - name: Install Chromium for release route smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Release gates
        run: pnpm run release:gates

      - name: Launch evidence gate
        run: pnpm run launch:evidence
