name: SIRE Authenticated Cloud Evidence Anti-Forgery Proof

on:
  push:
    branches:
      - sire/vish-cloud-save-proof-honesty-20261027
    paths:
      - .github/workflows/sire-cloud-save-evidence-proof.yml

permissions:
  contents: read

jobs:
  evidence:
    name: Regress cloud proof authenticity and reject historical service-role PASS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact code-only source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-cloud-save-evidence-proof.yml
          test "$(git write-tree)" = "d453decbc6db6d49508b1492d30e24a6883dd2a1"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse verification scripts
        run: |
          node --check scripts/lib/save-reload-evidence.mjs
          node --check scripts/verify-supabase-save-reload.mjs
          node --check scripts/quality/check-launch-evidence.mjs
      - name: Run seven fail-closed cloud proof test cases
        run: pnpm exec vitest run scripts/lib/save-reload-evidence.test.mjs
      - name: Verify normal launch template remains structurally valid
        run: pnpm run launch:evidence
      - name: Prove strict launch refuses service-role historical diagnostic
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(pnpm run launch:evidence:strict 2>&1)"
          outcome=$?
          set -e
          if [ "$outcome" -eq 0 ]; then
            echo '::error::Unexpectedly certified a service-role diagnostic as production cloud save'
            exit 1
          fi
          if ! grep -Fq 'Only authenticated interactive-browser evidence' <<< "$output"; then
            echo '::error::Strict launch did not reject the historical API-only evidence mode'
            echo "$output" | tail -n 40
            exit 1
          fi
          echo 'PASS: strict production release correctly BLOCKED on old API-only receipt'

  regression:
    name: Full Vitest TypeScript and security regression on evidence repair
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact code-only source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-cloud-save-evidence-proof.yml
          test "$(git write-tree)" = "d453decbc6db6d49508b1492d30e24a6883dd2a1"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full unit regression
        run: pnpm run test
      - name: TypeScript static verification
        run: pnpm run lint:types
      - name: Production and API security
        run: pnpm run hardening:gates
      - name: System and auth contracts
        run: pnpm run contract:gates && pnpm run auth:gates
