name: SIRE Canvas Input And Undo Real Browser Evidence

on:
  push:
    branches:
      - sire/vish-canvas-pointer-diagnosis-20261027
    paths:
      - .github/workflows/sire-canvas-input-proof.yml
      - src/components/editor/BlueprintCanvas.tsx

permissions:
  contents: read

jobs:
  canvas-and-pencil:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Prove exact git revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build local-only E2E preview
        run: node scripts/build-e2e-local.mjs
      - name: Start isolated preview and exercise source pointer input
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-canvas.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/editor > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vish-canvas.log
            exit 1
          fi
          pnpm exec playwright test e2e/ipad-editor-current-contract.spec.ts --project=app-smoke-chromium --grep 'Apple Pencil taps create a wall|Pencil eraser deletes a newly created wall'
          pnpm exec playwright test e2e/ipad-editor-workflow.spec.ts --project=app-smoke-chromium --grep 'draws wall, places door|draws wall and shows properties|undo reverts wall draw'
      - name: Archive debug screenshots traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
