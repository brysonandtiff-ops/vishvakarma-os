name: SIRE Exact-Tree Editor Prebuilt Chromium Evidence

on:
  push:
    branches:
      - sire/vish-editor-prebuilt-browser-proof-20261027
    paths:
      - .github/workflows/sire-editor-prebuilt-proof.yml

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_REUSE_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact application source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-editor-prebuilt-proof.yml
          test "$(git write-tree)" = "5220e59f0fc533748002032732c5bbfef4ddc08c"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Install frozen app deps on prebuilt official Playwright 1.60 container
        run: pnpm install --frozen-lockfile
      - name: Build identical isolated E2E runtime
        run: node scripts/build-e2e-local.mjs
      - name: Run complete 43-case iPad phone canvas dialog and save suite
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-editor-prebuilt.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/editor >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vish-editor-prebuilt.log
            exit 1
          fi
          pnpm exec playwright test e2e/ipad-editor-layout.spec.ts e2e/ipad-editor-workflow.spec.ts e2e/ipad-editor-current-contract.spec.ts e2e/device-phone-editor.spec.ts e2e/editor-features.spec.ts --project=app-smoke-chromium
      - name: Archive evidence including any failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-prebuilt-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
