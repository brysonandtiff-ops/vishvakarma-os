name: SIRE Mandatory Tracked Credential Security Guard Acceptance

on:
  push:
    branches:
      - sire/vish-prevent-tracked-secret-recurrence-20261027
    paths:
      - .github/workflows/sire-source-secret-gate-proof.yml

permissions:
  contents: read

jobs:
  security:
    name: Forbidden tracked files and required hardening guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact app source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-source-secret-gate-proof.yml
          test "$(git write-tree)" = "9e97a3782fb81b0e081cf2ff690e367b34bb594a"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify protected path contract in real unit tests
        run: pnpm exec vitest run scripts/security/forbidden-tracked-paths.test.mjs
      - name: Enforce all mandatory production and repository guards
        run: pnpm run hardening:gates
      - name: Verify compiled application and API types
        run: pnpm run lint:types

  full-units:
    name: Full unit regression including prohibited path tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact app source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f -- .github/workflows/sire-source-secret-gate-proof.yml
          test "$(git write-tree)" = "9e97a3782fb81b0e081cf2ff690e367b34bb594a"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full Vitest
        run: pnpm run test
      - name: Existing auth and system contracts
        run: pnpm run auth:gates && pnpm run contract:gates
