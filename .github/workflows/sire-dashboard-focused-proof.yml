name: SIRE Focused Dashboard Browser Evidence

on:
  push:
    branches:
      - sire/vish-dashboard-focused-proof-20261026
    paths:
      - .github/workflows/sire-dashboard-focused-proof.yml

permissions:
  contents: read

jobs:
  dashboard-shortcut-acceptance:
    name: Three editor shortcut dialogs - real Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
      - name: Confirm tested source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up pnpm 9.15.0
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build local-only E2E preview with no live Supabase connection
        run: node scripts/build-e2e-local.mjs
      - name: Start test preview, verify HTTP readiness, and prove dialogs
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-test-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/projects >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Local e2e preview failed HTTP readiness"
            cat /tmp/vish-test-preview.log
            exit 1
          fi
          echo "Local-only preview is responding on port 4173"
          pnpm exec playwright test e2e/dashboard-shortcuts.spec.ts --project=app-smoke-chromium
      - name: Archive visual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            playwright-report/
            test-results/
