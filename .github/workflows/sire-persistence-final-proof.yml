name: SIRE Final Local Persistence Browser Proof

on:
  push:
    branches:
      - sire/vish-local-project-reload-20261027
    paths:
      - .github/workflows/sire-persistence-final-proof.yml
      - e2e/ipad-editor-workflow.spec.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  named-project-save-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build isolated local-only runtime
        run: node scripts/build-e2e-local.mjs
      - name: Real iPad project create save reload and project-list proof
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vish-persist.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/editor > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vish-persist.log
            exit 1
          fi
          pnpm exec playwright test e2e/ipad-editor-workflow.spec.ts --project=app-smoke-chromium --grep 'named local project persists after reload'
          pnpm exec playwright test e2e/projects-profile.spec.ts --project=app-smoke-chromium
      - name: Preserve real-browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-persistence-final-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            test-results/
            playwright-report/
