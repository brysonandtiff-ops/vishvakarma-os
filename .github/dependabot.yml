version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      runtime-security:
        patterns:
          - react-router
          - react-router-dom
          - postcss
        update-types:
          - patch
          - minor
